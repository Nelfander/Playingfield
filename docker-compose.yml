version: '3.8'

services:
  # This is our S3-compatible storage
  minio:
    image: minio/minio:latest
    container_name: playingfield-minio
    ports:
      - "9000:9000" # API: Go code talks here
      - "9001:9001" # Web Dashboard: You look here
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  minio_data:
