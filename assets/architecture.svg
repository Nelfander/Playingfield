<svg width="100%" viewBox="0 0 680 860" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    text { font-family: sans-serif; fill: #1a1a1a; }
    .th { font-size: 14px; font-weight: 600; }
    .ts { font-size: 12px; fill: #444; }
    .arr { stroke: #888; stroke-width: 1.2; fill: none; }
  </style>

  <!-- CLIENTS -->
  <rect x="190" y="20" width="300" height="52" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
  <text class="th" x="340" y="41" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Clients</text>
  <text class="ts" x="340" y="59" text-anchor="middle" dominant-baseline="central" fill="#534AB7">React frontend + browser</text>

  <!-- Arrows down from clients -->
  <line x1="230" y1="72" x2="150" y2="136" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="340" y1="72" x2="340" y2="136" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="450" y1="72" x2="530" y2="136" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text class="ts" x="170" y="108" text-anchor="middle">HTTP/REST</text>
  <text class="ts" x="340" y="108" text-anchor="middle">WebSocket</text>
  <text class="ts" x="516" y="108" text-anchor="middle">Admin/Scripts</text>

  <!-- ECHO SERVER -->
  <rect x="60" y="136" width="180" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th" x="150" y="157" text-anchor="middle" dominant-baseline="central" fill="#085041">Echo server</text>
  <text class="ts" x="150" y="175" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">cmd/server</text>

  <!-- WS UPGRADE -->
  <rect x="250" y="136" width="180" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th" x="340" y="157" text-anchor="middle" dominant-baseline="central" fill="#085041">WS upgrade</text>
  <text class="ts" x="340" y="175" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Gorilla WebSocket</text>

  <!-- SCRIPTS -->
  <rect x="450" y="136" width="170" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="535" y="157" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Scripts</text>
  <text class="ts" x="535" y="175" text-anchor="middle" dominant-baseline="central" fill="#444441">scripts/ stress tests</text>

  <!-- Arrows down -->
  <line x1="150" y1="188" x2="150" y2="244" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="340" y1="188" x2="420" y2="244" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- MIDDLEWARE -->
  <rect x="60" y="244" width="180" height="100" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="th" x="150" y="268" text-anchor="middle" dominant-baseline="central" fill="#712B13">Middleware stack</text>
  <text class="ts" x="150" y="288" text-anchor="middle" fill="#993C1D">JWT auth</text>
  <text class="ts" x="150" y="306" text-anchor="middle" fill="#993C1D">Rate limiting</text>
  <text class="ts" x="150" y="324" text-anchor="middle" fill="#993C1D">RBAC / ownership</text>

  <!-- WS HUB -->
  <rect x="260" y="244" width="200" height="100" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th" x="360" y="268" text-anchor="middle" dominant-baseline="central" fill="#085041">WebSocket hub</text>
  <text class="ts" x="360" y="288" text-anchor="middle" fill="#0F6E56">Room management</text>
  <text class="ts" x="360" y="306" text-anchor="middle" fill="#0F6E56">Broadcasts</text>
  <text class="ts" x="360" y="324" text-anchor="middle" fill="#0F6E56">Heartbeats / cleanup</text>

  <!-- Arrows to handlers -->
  <line x1="150" y1="344" x2="150" y2="400" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="360" y1="344" x2="280" y2="400" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- HANDLERS -->
  <rect x="60" y="400" width="380" height="100" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="250" y="424" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Handlers — interfaces/http/</text>
  <text class="ts" x="250" y="448" text-anchor="middle" fill="#185FA5">UserHandler · ProjectHandler · TaskHandler</text>
  <text class="ts" x="250" y="466" text-anchor="middle" fill="#185FA5">MessageHandler · File upload/delete</text>

  <!-- Arrow to services -->
  <line x1="250" y1="500" x2="250" y2="556" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- DOMAIN SERVICES -->
  <rect x="60" y="556" width="380" height="88" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="250" y="580" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Domain services — internal/domain/*</text>
  <text class="ts" x="250" y="602" text-anchor="middle" fill="#185FA5">user · projects · tasks · messages</text>
  <text class="ts" x="250" y="620" text-anchor="middle" fill="#185FA5">Business rules · use-case orchestration</text>

  <!-- Arrow to repos -->
  <line x1="250" y1="644" x2="250" y2="700" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- REPOSITORY INTERFACES -->
  <rect x="60" y="700" width="380" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="250" y="721" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Repository interfaces</text>
  <text class="ts" x="250" y="739" text-anchor="middle" fill="#444441">internal/domain/*/repository.go</text>

  <!-- Arrow to infra -->
  <line x1="250" y1="752" x2="250" y2="796" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- INFRASTRUCTURE -->
  <rect x="60" y="796" width="380" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="250" y="817" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Infrastructure — sqlc implementations</text>
  <text class="ts" x="250" y="835" text-anchor="middle" fill="#444441">internal/infrastructure/postgres</text>

  <!-- Arrow to storage -->
  <line x1="440" y1="822" x2="488" y2="786" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- PostgreSQL -->
  <rect x="490" y="736" width="158" height="52" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
  <text class="th" x="569" y="757" text-anchor="middle" dominant-baseline="central" fill="#3C3489">PostgreSQL</text>
  <text class="ts" x="569" y="775" text-anchor="middle" fill="#534AB7">Neon serverless</text>

  <!-- MinIO -->
  <rect x="490" y="800" width="158" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="th" x="569" y="818" text-anchor="middle" dominant-baseline="central" fill="#633806">MinIO / S3</text>
  <text class="ts" x="569" y="836" text-anchor="middle" fill="#854F0B">Atomic uploads</text>
</svg>
