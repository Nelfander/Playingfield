global:
  scrape_interval: 15s
  evaluation_interval: 15s 

scrape_configs:
  - job_name: 'playingfield-app'
    static_configs:
      - targets: ['app:8080'] # 'app' is the service name from your docker-compose
    metrics_path: /metrics 

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090'] # This stays localhost because Prometheus scrapes itself

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100'] # This monitors your EC2 hardware